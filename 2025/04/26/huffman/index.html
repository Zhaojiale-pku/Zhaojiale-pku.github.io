">(<span class="hljs-type">int</span>*a,<span class="hljs-type">int</span>*b)</span>&#123;<br>	<span class="hljs-type">int</span> temp=*a;<br>	*a=*b;<br>	*b=temp;<br>&#125;<br><br><span class="hljs-type">void</span> <span class="hljs-title function_">heapify_down</span><span class="hljs-params">(<span class="hljs-type">int</span> arr[],<span class="hljs-type">int</span> size,<span class="hljs-type">int</span> i)</span>&#123;<br>	<span class="hljs-type">int</span> smallest=i;<br>	<span class="hljs-type">int</span> left=<span class="hljs-number">2</span>*i+<span class="hljs-number">1</span>;<br>	<span class="hljs-type">int</span> right=<span class="hljs-number">2</span>*i+<span class="hljs-number">2</span>;<br><br>	<span class="hljs-keyword">if</span>(left&lt;size&amp;&amp;arr[left]&lt;arr[smallest])&#123;<br>		smallest=left;<br>	&#125;<br>	<span class="hljs-keyword">if</span>(right&lt;size&amp;&amp;arr[right]&lt;arr[smallest])&#123;<br>		smallest=right;<br>	&#125;<br>	<span class="hljs-keyword">if</span>(smallest!=i)&#123;<br>		swap(&amp;arr[smallest],&amp;arr[i]);<br>		heapify_down(arr,size,smallest);<br>	&#125;<br>&#125;<br><br><span class="hljs-type">void</span> <span class="hljs-title function_">build_min_heap</span><span class="hljs-params">(<span class="hljs-type">int</span> arr[],<span class="hljs-type">int</span> size)</span>&#123;<br>	<span class="hljs-keyword">for</span>(<span class="hljs-type">int</span> i=size/<span class="hljs-number">2</span><span class="hljs-number">-1</span>;i&gt;=<span class="hljs-number">0</span>;i--)&#123;<br>		heapify_down(arr,size,i);<br>	&#125;<br>&#125;<br><br><span class="hljs-type">void</span> <span class="hljs-title function_">heapify_up</span><span class="hljs-params">(<span class="hljs-type">int</span> arr[],<span class="hljs-type">int</span> index)</span>&#123;<br>	<span class="hljs-keyword">while</span>(index&gt;<span class="hljs-number">0</span>)&#123;<br>		<span class="hljs-type">int</span> parent=(index<span class="hl class="hljs-number">0</span>)&#123;<br>				active_chars[active_size++]=c;<br>			&#125;<br>			freq[idx]++;<br>		&#125;<br>		<span class="hljs-keyword">else</span>&#123;<br>			<span class="hljs-keyword">if</span>(active_size==<span class="hljs-number">0</span>)&#123;<br>				output[k++]=<span class="hljs-number">0</span>;<br>				<span class="hljs-keyword">continue</span>;<br>			&#125;<br>			<span class="hljs-type">int</span> size=active_size+<span class="hljs-number">1</span>;<br>			<span class="hljs-type">int</span>*temp=(<span class="hljs-type">int</span>*)<span class="hljs-built_in">malloc</span>(size*<span class="hljs-keyword">sizeof</span>(<span class="hljs-type">int</span>));<br>			temp[<span class="hljs-number">0</span>]=<span class="hljs-number">1</span>;<br><br>			<span class="hljs-keyword">for</span>(<span class="hljs-type">int</span> j=<span class="hljs-number">0</span>;j&lt;active_size;j++)&#123;<br>				temp[j+<span class="hljs-number">1</span>]=freq[active_chars[j]<span class="hljs-number">-1</span>];<br>			&#125;<br><br>			build_min_heap(temp,size);<br>			<span class="hljs-type">int</span> sum=<span class="hljs-number">0</span>;<br>			<span class="hljs-type">int</span> len=size;<br><br>			<span class="hljs-keyword">while</span>(len&gt;<span class="hljs-number">1</span>)&#123;<br>				<span class="hljs-type">int</span> a=temp[<span class="hljs-number">0</span>];<br>				temp[<span class="hljs-number">0</span>]=temp[--len];<br>				heapify_down(temp,len,<span class="hljs-number">0</span>);<br><br>				<span class="hljs-type">int</span> b=temp[<span class="hljs-number">0</span>];<br>				temp[<span class="hljs-number">0</span>]=temp[--len];<br>				heapify_down(temp,len,<span class="hljs-number">0</span>);<br><br>				sum+=a+b;<br>				temp[len++]=a+b;<br>				heapify_up(temp,len<span class="hljs-number">-1</span>);<br>			&#125;<br>			output[k++]=sum;<br>			<span class="hljs-built_in">free</span>(temp);<br>		&#125;<br>	&#125;<br><br>	<span class="hljs-built_in">free<
